services:
  # Backend Service
  - type: web
    name: proyectchat-backend
    runtime: docker
    repo: https://github.com/your-username/proyectchat-backend
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 8080
      - key: SERVER_ADDRESS
        value: 0.0.0.0:8080
